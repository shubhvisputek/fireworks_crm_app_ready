services:
  - type: web
    name: fireworks-crm
    runtime: python
    plan: 0.5c-512mb
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py
    healthCheckPath: /
    disk:
      name: fireworks-crm-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: FIREWORKS_DB
        value: /var/data/fireworks.db
      - key: FIREWORKS_SECRET
        value: /var/data/.secret
      - key: FIREWORKS_REQUIRE_ADMIN_PASSWORD
        value: "1"
      - key: FIREWORKS_SECURE_COOKIES
        value: "1"
      # Render's proxy adds the visitor's address to X-Forwarded-For; used for login throttling.
      - key: FIREWORKS_TRUST_PROXY
        value: "1"
      # The onrender.com name is allowed automatically (RENDER_EXTERNAL_HOSTNAME). For a custom domain,
      # list it here, comma-separated, e.g. billing.myshop.in
      - key: FIREWORKS_ALLOWED_HOSTS
        value: ""
      - key: FIREWORKS_ADMIN_PASSWORD
        sync: false