services:
  - type: web
    name: fireworks-crm
    runtime: python
    plan: 0.5c-512mb
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py
    healthCheckPath: /
    disk:
      name: fireworks-crm-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: FIREWORKS_DB
        value: /var/data/fireworks.db
      - key: FIREWORKS_SECRET
        value: /var/data/.secret
      - key: FIREWORKS_REQUIRE_ADMIN_PASSWORD
        value: "1"
      - key: FIREWORKS_SECURE_COOKIES
        value: "1"
      - key: FIREWORKS_ADMIN_PASSWORD
        sync: false